[project]
name = "trend-shorts-agent"
version = "0.1.0"
description = "트렌드 숏폼 자동 제작 AI 에이전트"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "numpy>=1.26",
    "pretty_midi>=0.2.10",
    "soundfile>=0.12",
    "pillow>=10.0",
    "apscheduler>=3.10,<4",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
review = ["streamlit>=1.35"]
publish = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: ffmpeg/fluidsynth를 실제로 실행하는 테스트",
]
