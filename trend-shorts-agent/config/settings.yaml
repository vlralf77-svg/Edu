schedule:
  timezone: Asia/Seoul
  run_at: "07:00"
  retry_count: 2              # 자동 실행 실패(서버 혼잡 등) 시 재시도 횟수
  retry_wait_min: 20          # 재시도 전 대기(분) — 이어서 진행하므로 완료된 단계는 다시 하지 않음

collect:
  region_code: KR
  relevance_language: ko
  published_within_hours: 48
  min_view_count: 100000
  max_videos: 50
  include_shorts: true
  category_ids: []            # 비우면 전체. 예: [25(뉴스), 24(엔터), 28(과학기술)]
  search_queries: ["뉴스", "이슈", "속보"]   # search.list 보조 검색어 (1회당 100유닛)
  exclude_keywords: ["도박", "성인"]
  dedupe_days: 7
  daily_quota: 10000
  quota_stop_ratio: 0.8

llm:
  provider: gemini            # gemini: Google Gemini (무료 등급 가능, GEMINI_API_KEY) | claude: Anthropic Claude (유료)
  gemini_model: gemini-flash-latest   # 구글이 관리하는 '최신 flash' 별칭. 한도가 끝나면 다른 flash 모델로 자동 전환
  gemini_min_interval_sec: 13 # 무료 등급 분당 호출 제한(약 5회) 대비 호출 간격(초)
  gemini_retries: 4           # 혼잡(503)·분당 한도(429) 때 같은 모델 재시도 횟수
  gemini_fallback_models: [gemini-flash-latest, gemini-flash-lite-latest]   # 그다음엔 계정에서 쓸 수 있는 flash 모델 자동 탐색
  gemini_price_per_mtok: {input: 0.0, output: 0.0}   # 무료 등급은 0. 유료 등급으로 바꾸면 요금 입력
  # ---- 아래는 provider: claude 일 때
  model: claude-opus-5-5
  effort: medium              # low | medium | high | xhigh | max
  max_tokens: 16000
  fallbacks: default          # 거절(refusal) 시 서버 측 대체 모델 사용. 끄려면 null
  max_retries: 3
  price_per_mtok: {input: 4.0, output: 20.0}
  web_search_price_per_1k: 10.0

research:
  provider: auto              # auto(Gemini→news, Claude→llm) | news(구글 뉴스 RSS, 무료·키 불필요) | llm(AI 내장 웹 검색) | tavily | serper
  searches_per_topic: 3
  min_sources: 2

topics:
  max_topics_per_day: 3       # Gemini 무료 등급은 모델별 하루 호출 수가 적어 3개 권장 (주제당 약 4~5회 호출)
  min_videos_per_topic: 1
  weights: {total_views: 0.35, views_per_hour: 0.35, video_count: 0.1, fitness: 0.2}

script:
  max_seconds: 60
  target_chars_ko: 300        # 한국어 낭독 기준 약 280~320자 ≈ 55~60초
  chars_per_second: 5.2
  max_rewrites: 2
  tone: "친근하고 빠른 뉴스 브리핑"
  structure: [hook, context, key_points, closing]

production:
  resolution: [1080, 1920]
  fps: 30
  tts_provider: elevenlabs    # elevenlabs | google | dummy(오프라인 테스트용)
  voice_id: ""
  elevenlabs_model: eleven_multilingual_v2
  # 장면 비주얼 우선순위. 앞에서 못 찾으면 다음 소스, 전부 실패하면 키워드 타이포그래피 카드
  #  commons: 실존 인물·기관·장소 사진 (Wikimedia Commons, 상업 이용 가능 라이선스만, 키 불필요)
  #  pexels_video / pixabay_video: 실제 촬영 스톡 영상 클립 (무료 상업 이용)
  #  pexels / pixabay: 스톡 사진
  visual_sources: [commons, pixabay_video, pexels_video, pixabay, pexels]   # 키가 없는 소스는 자동으로 건너뜀
  commons_max_per_subject: 2  # 같은 인물 사진은 한 영상에 최대 2장 (나머지 장면은 현장감 있는 영상 클립)
  max_clip_mb: 80
  burn_subtitles: true
  subtitle_max_chars: 14
  font_path: ""               # 비우면 assets/fonts → 시스템 Noto Sans CJK 순으로 탐색
  max_tts_speed: 1.15

bgm:
  mode: generate              # generate | library | hybrid
  volume: 0.08
  sad_volume: 0.05
  sad_disable: false          # true면 sad(추모·재난) 주제는 BGM 없이
  ducking_db: -12
  fade_in_sec: 0.5
  fade_out_sec: 1.5
  soundfont: assets/soundfonts/FluidR3_GM.sf2   # MIT 라이선스 사운드폰트
  library_dir: assets/bgm/library
  avoid_repeat_days: 7

review:
  require_approval: true
  auto_produce_top_n: 3

notify:
  enabled: false

publish:
  enabled: false
  privacy: private

budget:
  max_daily_cost_usd: 5.0

paths:
  data_dir: data
  db_url: ""                  # 비우면 sqlite:///data/agent.db
