# 가족통화 앱 안드로이드 APK 빌드 워크플로
#
# - 브랜치 push · 수동 실행 · v* 태그 push 시 APK 빌드
# - 아티팩트 업로드 + latest 태그로 GitHub Release 자동 생성 → 직접 다운로드 링크 제공
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "빌드 타입"
        type: choice
        default: debug
        options:
          - debug
          - release
  push:
    branches:
      - claude/family-data-wifi-calling-app-fpfqfh
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Vite)
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Rename APK
        id: apk
        run: |
          mkdir -p out
          SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "APK not found"; exit 1
          fi
          DEST="out/family-call-${{ github.sha }}.apk"
          cp "$SRC" "$DEST"
          # 다운로드용 심볼릭 이름도 하나 더
          cp "$SRC" "out/family-call-latest.apk"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-call-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish "latest" Release with APK
        # 브랜치 push 나 수동 실행에서 실행 (태그 push 아닌 경우만)
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "가족통화 최신 빌드 (Debug APK)"
          body: |
            자동 빌드된 APK 입니다. 스마트폰에서 아래 `family-call-latest.apk` 를 눌러 다운로드하세요.

            - 빌드 커밋: ${{ github.sha }}
            - 빌드 시각: ${{ github.event.head_commit.timestamp }}

            📱 설치 방법:
            1. 안드로이드 폰에서 링크를 눌러 APK 를 다운로드
            2. 설정 → 알 수 없는 앱 설치 허용
            3. 다운로드된 APK 를 눌러 설치
          files: |
            out/family-call-latest.apk
            out/family-call-${{ github.sha }}.apk
          prerelease: true
          make_latest: "true"
          fail_on_unmatched_files: true

      - name: Publish Tagged Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          fail_on_unmatched_files: true
